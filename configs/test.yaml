# sample_data.csv: Mol.1 + Temperature → Emission Peak 예시용
data:
  reactant_column: Mol.1
  target_column:
    - "Emission Peak"
    - "FWHM"
  reactant_delimiter: "|"
  reactant_allowed_values:
    - "1,5-Diaminonaphthalene"
    - "1,8-Diaminonaphthalene"
    - "2,3-Diaminonaphthalene"
    - "2,6-Diaminonaphthalene"
  condition_ranges:
    Temperature:
      min: 0
      max: 600
  ignore_columns:
    - PLQY
  explicit_condition_types:
    Temperature: continuous

featurization:
  featuriser: morgan_fp
  combine_strategy: concat

optimization:
  objective: target  # 전역 기본 objective (target_objectives에 없는 타깃에만 적용)
  suggestion_strategy: best_output
  standardize_gp_inputs: false  # true면 결합 특징을 학습 min-max로 [0,1]
  standardize_gp_targets: false  # true면 Y 표준화 후 학습(BoTorch Y 경고 완화); predict·target_value는 원 스케일
  target_value: null  # 다중 타깃에서는 아래 target_objectives 개별 설정을 사용
  target_objectives:
    Emission Peak:
      objective: target
      target_value: 490.0
      weight: 1.0
    FWHM:
      objective: minimize
      weight: 0.8
  n_restarts: 10
  raw_samples: 128
  target_search_size: 5000
  n_candidates: 3
