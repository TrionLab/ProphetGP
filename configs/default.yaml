data:
  reactant_column: reactants
  target_column: target
  reactant_delimiter: "|"
  reactant_allowed_values: []
  condition_ranges: {}
  # 예:
  # condition_ranges:
  #   temperature:
  #     min: 20
  #     max: 120
  #   catalyst:
  #     allowed_values: ["A", "B"]
  explicit_condition_types: {}
  # 예: {"catalyst": "categorical", "temperature": "continuous"}

featurization:
  featuriser: ecfp_fingerprints
  # available: "auto" 또는 gauche에서 조회되는 featuriser 이름
  combine_strategy: concat

optimization:
  objective: maximize
  suggestion_strategy: best_output
  target_value: null
  target_objectives: {}
  # 예:
  # target_objectives:  # 다중 타깃일 때 컬럼별 objective/target_value/weight 지정
  #   Emission Peak: { objective: target, target_value: 500, weight: 1.0 }
  #   FWHM: { objective: minimize, weight: 0.5 }
  n_restarts: 10
  raw_samples: 128
  target_search_size: 4096
  n_candidates: 5
